<app-auth-layout title="Forgot your password?" eyebrow="Account recovery" description="Enter your account email. We’ll send a 6-digit code to your registered phone number.">
  <form [formGroup]="rxform" (ngSubmit)="onSubmit()" class="space-y-5" [attr.aria-busy]="isLoading">
    <div>
      <label for="recovery-email" class="ui-label">
        Email address
      </label>
      <input id="recovery-email" type="email" class="ui-input" placeholder="you@example.com" formControlName="emailAddress" autocomplete="email" [attr.aria-invalid]="emailAddress.touched && emailAddress.invalid">
      @if (emailAddress.touched && emailAddress.invalid) {
      <p class="mt-2 text-xs text-danger" role="alert">
        Enter a valid email address.
      </p>
      }
    </div>
    <button type="submit" class="ui-button w-full" [disabled]="!rxform.valid || isLoading">
      {{ isLoading ? 'Sending…' : 'Send verification code' }}
    </button>
  </form>
  <div class="mt-7 border-t border-stroke pt-5">
    <a routerLink="/app/login" class="ui-button-ghost w-full">
      <span class="material-icons !text-lg" aria-hidden="true">
        arrow_back
      </span>
      Back to sign in
    </a>
  </div>
</app-auth-layout>
