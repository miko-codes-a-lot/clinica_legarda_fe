<mat-form-field [appearance]="appearance" [floatLabel]="floatLabel" (click)="picker.open()">
  <mat-label *ngIf="label">{{ label }}</mat-label>
  <input
    matInput
    [matDatepicker]="picker"
    [placeholder]="placeholder"
    [value]="value"
    [disabled]="disabled"
    [min]="minDate"
    [max]="maxDate"
    [matDatepickerFilter]="dateFilter"
    (dateInput)="onDateChange($event)"
    (dateChange)="onDateChange($event)"
    (keydown.enter)="picker.open(); $event.preventDefault()"
    (keydown.space)="picker.open(); $event.preventDefault()"
    readonly
  />
  <mat-hint *ngIf="hint">{{ hint }}</mat-hint>
  <mat-datepicker-toggle matIconSuffix [for]="picker" [disabled]="disabled"></mat-datepicker-toggle>
  <mat-datepicker #picker [touchUi]="touchUi" [startView]="startView"></mat-datepicker>
  <mat-error *ngIf="showError">
    {{ errorMessage }}
  </mat-error>
</mat-form-field>
