<h2 mat-dialog-title class="dialog-title">Update Clinic Notes</h2>

<form [formGroup]="form" class="dialog-body">
  <mat-dialog-content>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Clinic Notes</mat-label>
    <textarea
      matInput
      formControlName="clinicNotes"
      rows="6"
      placeholder="Enter your findings here..."
    ></textarea>
  </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="dialog-actions">
    <button type="button" mat-stroked-button (click)="onCancel()">Cancel</button>
    <button
      type="button"
      mat-flat-button
      color="primary"
      [disabled]="!form.dirty || form.controls['clinicNotes'].value === initialNotes"
      (click)="onSave()"
    >
      Save
    </button>
  </mat-dialog-actions>
</form>
