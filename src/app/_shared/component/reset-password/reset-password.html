<app-auth-layout title="Set a new password" eyebrow="Account recovery" description="Choose a new password to keep your account secure.">
  @if (rxform) {
  <form [formGroup]="rxform" (ngSubmit)="onSubmit()" class="space-y-5" [attr.aria-busy]="isLoading">
    <div>
      <label for="new-password" class="ui-label">
        New password
      </label>
      <input id="new-password" type="password" class="ui-input" placeholder="Enter a new password" formControlName="newPassword" autocomplete="new-password" aria-describedby="password-requirements" [attr.aria-invalid]="newPassword.touched && newPassword.invalid">
      <p id="password-requirements" class="mt-2 text-xs leading-5 text-muted">
        {{ passwordRequirementsMessage }}
      </p>
      @if (newPassword.touched && newPassword.hasError('pattern')) {
      <p class="mt-2 text-xs text-danger" role="alert">
        {{ passwordRequirementsMessage }}
      </p>
      }
    </div>
    <div>
      <label for="confirm-password" class="ui-label">
        Confirm password
      </label>
      <input id="confirm-password" type="password" class="ui-input" placeholder="Re-enter your new password" formControlName="confirmPassword" autocomplete="new-password" [attr.aria-invalid]="confirmPassword.touched && (confirmPassword.invalid || rxform.errors?.['mismatch'])">
      @if (rxform.errors?.['mismatch'] && confirmPassword.touched) {
      <p class="mt-2 text-xs text-danger" role="alert">
        Passwords do not match.
      </p>
      }
    </div>
    <button type="submit" class="ui-button w-full" [disabled]="!rxform.valid || isLoading">
      {{ isLoading ? 'Resetting…' : 'Reset password' }}
    </button>
  </form>
  }
  <div class="mt-7 border-t border-stroke pt-5">
    <a routerLink="/app/login" class="ui-button-ghost w-full">
      <span class="material-icons !text-lg" aria-hidden="true">
        arrow_back
      </span>
      Back to sign in
    </a>
  </div>
</app-auth-layout>
