<section [class.ui-card]="framed">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" [attr.aria-busy]="isLoading">
    <div class="ui-form-grid">
    @for (field of fields; track field.name) {
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>{{ field.label }}</mat-label>

        @if (field.type !== 'select') {
          <input
            [readonly]="field.readonly || null"
            matInput
            [type]="field.type"
            [formControlName]="field.name"
            [attr.maxlength]="field?.maxlength || null"
          />
        }

        @if (field.type === 'select') {
          <mat-select [formControlName]="field.name" (selectionChange)="field.selectionChange ? field.selectionChange($event) : null"  [multiple]="field?.multiple">
            @for (opt of field.options; track opt.value) {
              <mat-option [value]="opt.value">
                {{ opt.label }}
              </mat-option>
            }
          </mat-select>
        }

        <mat-error>
          <app-form-control-errors
            [control]="form.get(field.name)"
            [customMessage]="field.customError"
          ></app-form-control-errors>
        </mat-error>
      </mat-form-field>
    }

    </div>
    <ng-content></ng-content>
    <div class="mt-6 flex justify-end border-t border-stroke pt-5">
      <button type="submit" class="ui-button" [disabled]="isLoading || !form.valid">{{ isLoading ? busyLabel : submitLabel }}</button>
    </div>
  </form>
</section>
