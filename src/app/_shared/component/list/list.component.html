<section class="ui-card">
  <dl class="grid gap-x-8 sm:grid-cols-2">
    @for (row of dataInRows; track $index) {
      @for (pair of row; track pair[0]) {
        <div class="border-b border-stroke py-4 first:pt-0 sm:first:pt-4">
          <dt class="mb-1 text-xs font-medium text-muted">{{ labelMap[pair[0]] || formatKey(pair[0]) }}</dt>
          <dd class="m-0 break-words text-sm font-medium text-ink">{{ formatValue(pair[1], pair[0]) ?? '—' }}</dd>
        </div>
      }
    }
  </dl>
  <div class="detail-content"><ng-content></ng-content></div>
</section>
