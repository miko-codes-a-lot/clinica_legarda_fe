<app-generic-table
  title="Appointments"
  description="Review appointment requests and filter by clinic or status."
  [displayedColumns]="displayedColumns"
  [columnDefs]="columnDefs"
  [dataSource]="dataSource"
  [isLoading]="isLoading"
  [disableEditFn]="disableEdit"
  createButtonLabel="Create appointment"
  (details)="onDetails($event)"
  (update)="onUpdate($event)"
  (create)="onCreate()">
  <section table-filters class="ui-card mb-5" aria-label="Appointment filters">
<div class="grid gap-3 sm:grid-cols-[1fr_1fr_auto] sm:items-start">
  <mat-form-field appearance="outline">
    <mat-label>Clinic</mat-label>
    <mat-select [value]="selectedClinic" (selectionChange)="selectClinic($event.value)">
      <mat-option value="all">All clinics</mat-option>
      @for (clinic of clinics; track clinic._id) {
        <mat-option [value]="clinic._id">{{ clinic.name }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Status</mat-label>
    <mat-select [value]="selectedStatus" (selectionChange)="selectStatus($event.value)">
      <mat-option value="all">All statuses</mat-option>
      @for (status of statuses; track status.value) {
        <mat-option [value]="status.value">{{ status.label }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
  <button class="ui-button-secondary" type="button" (click)="refresh()" [disabled]="isLoading">Refresh</button>
</div>
@if (loadError) { <p role="alert">{{ loadError }}</p> }
  </section>
</app-generic-table>
