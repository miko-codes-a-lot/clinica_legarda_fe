<app-generic-table [resetKey]="scopeKey"
  title="Appointments"
  [description]="scopeDescription"
  [displayedColumns]="displayedColumns"
  [columnDefs]="columnDefs" [filters]="filters" [dateValue]="dateValue" sortBy="date" sortDirection="desc" (queryReset)="resetFilters()"
  [dataSource]="dataSource"
  [isLoading]="isLoading"
  [disableEditFn]="disableEdit"
  createButtonLabel="Create appointment"
  (details)="onDetails($event)"
  (update)="onUpdate($event)"
  (create)="onCreate()">
  <div table-filters class="flex flex-wrap items-end gap-3" aria-label="Appointment filters">
    <label class="grid w-48 gap-1"><span class="text-xs font-semibold text-muted">Clinic</span><select class="ui-input h-9 text-xs" [value]="selectedClinic" #clinicChoice (change)="selectClinic(clinicChoice.value)"><option value="all">{{ allClinicsLabel }}</option>@for (clinic of clinics; track clinic._id) { <option [value]="clinic._id">{{ clinic.name }}</option> }</select></label>
    <label class="grid w-36 gap-1"><span class="text-xs font-semibold text-muted">Status</span><select class="ui-input h-9 text-xs" [value]="selectedStatus" #statusChoice (change)="selectStatus(statusChoice.value)"><option value="all">All statuses</option>@for (status of statuses; track status.value) { <option [value]="status.value">{{ status.label }}</option> }</select></label>
    <button class="ui-button-ghost h-9 text-xs" type="button" (click)="refresh()" [disabled]="isLoading">Refresh</button>
    @if (loadError) { <p class="w-full text-xs text-danger" role="alert">{{ loadError }}</p> }
    @if (area === 'admin' && !isLoading && !loadError && clinics.length === 0) { <p class="w-full text-xs text-muted" role="status">No assigned clinics. Ask a super admin to assign a clinic before accessing appointments.</p> }
  </div>
</app-generic-table>
