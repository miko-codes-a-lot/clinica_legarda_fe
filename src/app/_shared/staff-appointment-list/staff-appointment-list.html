<app-generic-table [resetKey]="scopeKey"
  title="Appointments"
  [description]="scopeDescription"
  [displayedColumns]="displayedColumns"
  [columnDefs]="columnDefs" [filters]="filters" [dateValue]="dateValue" sortBy="date" sortDirection="desc" (queryReset)="resetFilters()"
  [dataSource]="dataSource"
  [isLoading]="isLoading"
  [disableEditFn]="disableEdit"
  createButtonLabel="Create appointment"
  (details)="onDetails($event)"
  (update)="onUpdate($event)"
  (create)="onCreate()">
  <div table-filters class="ui-table-filter-group ui-table-filter-group--inline" role="group" aria-label="Appointment filters">
    <label class="ui-table-field ui-table-field--clinic"><span>Clinic</span><select class="ui-input ui-table-control" [value]="selectedClinic" #clinicChoice (change)="selectClinic(clinicChoice.value)"><option value="all">{{ allClinicsLabel }}</option>@for (clinic of clinics; track clinic._id) { <option [value]="clinic._id">{{ clinic.name }}</option> }</select></label>
    <label class="ui-table-field"><span>Status</span><select class="ui-input ui-table-control" [value]="selectedStatus" #statusChoice (change)="selectStatus(statusChoice.value)"><option value="all">All statuses</option>@for (status of statuses; track status.value) { <option [value]="status.value">{{ status.label }}</option> }</select></label>
    <button class="ui-table-toolbar-action" type="button" aria-label="Refresh appointments" title="Refresh appointments" (click)="refresh()" [disabled]="isLoading"><app-icon name="arrow-path" /></button>
  </div>
  @if (loadError) { <p table-filters class="w-full text-xs text-danger" role="alert">{{ loadError }}</p> }
  @if (area === 'admin' && !isLoading && !loadError && clinics.length === 0) { <p table-filters class="w-full text-xs text-muted" role="status">No assigned clinics. Ask a super admin to assign a clinic before accessing appointments.</p> }
</app-generic-table>
