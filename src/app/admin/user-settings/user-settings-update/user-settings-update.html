<section class="ui-page max-w-4xl">
  <app-page-header title="Edit account" eyebrow="Account" description="Update your personal and contact information." />
  <form [formGroup]="profileForm" (ngSubmit)="onSave()" class="space-y-5">
    <section class="ui-card p-5 sm:p-6" aria-labelledby="account-name-title">
      <h2 id="account-name-title" class="ui-section-title mb-5">Full name</h2>
      <div class="ui-form-grid">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>First name</mat-label><input matInput formControlName="firstName">
          <mat-error><app-form-control-errors [control]="profileForm.get('firstName')" /></mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline" class="w-full"><mat-label>Middle name</mat-label><input matInput formControlName="middleName"></mat-form-field>
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Last name</mat-label><input matInput formControlName="lastName">
          <mat-error><app-form-control-errors [control]="profileForm.get('lastName')" /></mat-error>
        </mat-form-field>
      </div>
    </section>
    <section class="ui-card p-5 sm:p-6" aria-labelledby="account-contact-title">
      <h2 id="account-contact-title" class="ui-section-title mb-5">Contact information</h2>
      <div class="ui-form-grid">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Email address</mat-label><input matInput type="email" formControlName="emailAddress">
          <mat-error><app-form-control-errors [control]="profileForm.get('emailAddress')" /></mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Mobile number</mat-label><input matInput type="tel" formControlName="mobileNumber" maxlength="13">
          <mat-error><app-form-control-errors [control]="profileForm.get('mobileNumber')" /></mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline" class="w-full sm:col-span-2">
          <mat-label>Address</mat-label><textarea matInput formControlName="address" rows="3"></textarea>
          <mat-error><app-form-control-errors [control]="profileForm.get('address')" /></mat-error>
        </mat-form-field>
      </div>
    </section>
    <section class="ui-card p-5 sm:p-6" *ngIf="isDentist" aria-labelledby="account-hours-title">
      <div class="ui-toolbar mb-5">
        <h2 id="account-hours-title" class="ui-section-title">Operating hours</h2>
        <button type="button" class="ui-button-secondary" (click)="onAddSchedule()" [disabled]="operatingHours.length >= (clinicOperatingHours.value?.length || 0)">Add schedule</button>
      </div>
      <div formArrayName="operatingHours" class="space-y-4">
        <div class="rounded-xl border border-brand-100 bg-canvas p-4" *ngFor="let hour of operatingHours.controls; let i = index" [formGroupName]="i">
          <div class="ui-form-grid">
            <mat-form-field appearance="outline" class="w-full sm:col-span-2">
              <mat-label>Day</mat-label>
              <mat-select formControlName="day"><mat-option *ngFor="let day of days" [value]="day.code" [disabled]="getSelectedDays(i).includes(day.code)">{{ day.label }}</mat-option></mat-select>
            </mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>From</mat-label><input matInput type="time" formControlName="startTime"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>To</mat-label><input matInput type="time" formControlName="endTime"></mat-form-field>
          </div>
          <div class="mt-2 space-y-1 text-sm">
            <mat-error *ngIf="hour.errors?.['timeRangeInvalid'] && (hour.touched || hour.dirty)">End time must be after start time.</mat-error>
            <mat-error *ngIf="hour.errors?.['outsideClinicHours'] && (hour.touched || hour.dirty)">Time must be within the clinic's operating hours.</mat-error>
          </div>
          <button type="button" class="ui-button-danger mt-3" (click)="removeOperatingHour(i)">Remove</button>
        </div>
      </div>
    </section>
    <div class="flex flex-wrap gap-3">
      <button [disabled]="!profileForm.valid || isLoading" class="ui-button" type="submit">{{ isLoading ? 'Saving...' : 'Save changes' }}</button>
      <button type="button" class="ui-button-secondary" (click)="cancelEdit()">Cancel</button>
    </div>
  </form>
</section>
