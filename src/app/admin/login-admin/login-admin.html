<app-auth-layout [showThemeToggle]="true" title="Staff sign in" eyebrow="Clinic workspace" description="Sign in with your staff account to access your clinic workspace.">
  <form [formGroup]="rxform" (ngSubmit)="onSubmit()" class="space-y-5" [attr.aria-busy]="isLoading">
    <div>
      <label for="staff-username" class="ui-label">
        Username
      </label>
      <input id="staff-username" type="text" class="ui-input" placeholder="Enter your username" formControlName="username" autocomplete="username" [attr.aria-invalid]="username.touched && username.invalid">
      @if (username.touched && username.hasError('required')) {
      <p class="mt-2 text-xs text-danger" role="alert">
        Enter your username.
      </p>
      }
    </div>
    <div>
      <label for="staff-password" class="ui-label">
        Password
      </label>
      <input id="staff-password" type="password" class="ui-input" placeholder="Enter your password" formControlName="password" autocomplete="current-password" [attr.aria-invalid]="password.touched && password.invalid">
      @if (password.touched && password.hasError('required')) {
      <p class="mt-2 text-xs text-danger" role="alert">
        Enter your password.
      </p>
      }
    </div>
    <button type="submit" class="ui-button w-full" [disabled]="!rxform.valid || isLoading">
      {{ isLoading ? 'Signing in…' : 'Sign in to workspace' }}
      <app-icon class="!size-5" aria-hidden="true" name="arrow_forward" />
    </button>
  </form>
  <div class="mt-7 border-t border-stroke pt-6">
    <a routerLink="/app/home" class="ui-button-ghost w-full">
      <app-icon class="!size-5" aria-hidden="true" name="arrow_back" />
      Return to the clinic website
    </a>
  </div>
</app-auth-layout>
