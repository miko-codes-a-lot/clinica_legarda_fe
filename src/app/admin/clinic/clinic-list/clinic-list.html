@if (loadError) { <p role="alert">{{ loadError }}</p> }
@if (!isLoading && !loadError && !dataSource.data.length) { <p>No clinics yet.</p> }
<app-generic-table
  [title]="title"
  [createButtonLabel]="createLabel"
  [displayedColumns]="displayedColumns"
  [columnDefs]="columnDefs"
  [dataSource]="dataSource"
  [isLoading]="isLoading"
  [disableEditFn]="disableEdit"
  (details)="onDetails($event)"
  (update)="onUpdate($event)"
  (create)="onCreate()"
></app-generic-table>
