@if (loadError) {
  <div class="mx-auto max-w-7xl px-4 pt-7 sm:px-7 lg:px-9">
    <p class="rounded-xl border border-danger-border bg-danger-soft p-4 text-sm text-danger" role="alert">{{ loadError }}</p>
  </div>
}
<app-generic-table
  [title]="title"
  [description]="canManage ? 'Manage all clinics.' : 'Clinics currently assigned to your account.'"
  [createButtonLabel]="createLabel"
  [displayedColumns]="displayedColumns"
  [columnDefs]="columnDefs"
  [dataSource]="dataSource"
  [isLoading]="isLoading"
  [disableEditFn]="disableEdit"
  (details)="onDetails($event)"
  (update)="onUpdate($event)"
  (create)="onCreate()"
>
  @if (!canManage && !isLoading && !loadError && dataSource.data.length === 0) {
    <p table-filters class="ui-card mb-5 p-5 text-sm text-muted" role="status">No assigned clinics. Ask a super admin to assign a clinic to your account.</p>
  }
</app-generic-table>
