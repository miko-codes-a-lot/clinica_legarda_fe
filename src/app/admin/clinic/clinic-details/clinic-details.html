<section class="ui-page max-w-5xl">
  <app-page-header title="Clinic details" eyebrow="Management" description="Clinic information and weekly operating hours.">
    @if (clinic && canManage) { <button type="button" class="ui-button" (click)="onUpdate()">Edit clinic</button> }
  </app-page-header>
  @if (clinic) {
    <app-list [data]="displayClinic" />
    <section class="ui-card mt-5 p-5 sm:p-6" aria-labelledby="clinic-hours-title">
      <h2 id="clinic-hours-title" class="ui-section-title mb-4">Operating hours</h2>
      <dl class="grid gap-3 sm:grid-cols-2">
        @for (oh of clinic.operatingHours; track oh.day) {
          <div class="flex flex-wrap justify-between gap-2 rounded-xl border border-stroke bg-tint/40 p-4 text-sm">
            <dt class="font-semibold capitalize text-ink">{{ oh.day }}</dt>
            <dd class="text-muted">{{ oh.startTime }} – {{ oh.endTime }}</dd>
          </div>
        } @empty { <p class="ui-muted">No operating hours recorded.</p> }
      </dl>
    </section>
  } @else if (loadError) {
    <p class="ui-card border-danger-border bg-danger-soft p-5 text-sm text-danger" role="alert">{{ loadError }}</p>
  } @else {
    <p class="ui-card p-5 text-sm text-muted" role="status">Fetching details...</p>
  }
</section>
