<section class="ui-page max-w-4xl">
  <app-page-header title="Edit clinic" eyebrow="Management" description="Manage clinic information and operating hours." />
  @if (clinic) {
    <app-clinic-form
      [isLoading]="isLoading"
      [clinic]="clinic"
      [days]="days"
      (onSubmitEvent)="onSubmit($event)"
    ></app-clinic-form>
  } @else if (loadError) {
    <p class="ui-card mb-5 border-red-200 bg-red-50 p-4 text-sm text-red-800" role="alert">{{ loadError }}</p>
  } @else {
    <p class="ui-card p-5 text-sm text-muted" role="status">Fetching details...</p>
  }
</section>
