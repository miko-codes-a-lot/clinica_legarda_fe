  [createButtonLabel]="createLabel"
  [displayedColumns]="displayedColumns"
  [columnDefs]="columnDefs" [filters]="filters" sortBy="name" searchPlaceholder="Search services"

  (update)="onUpdate($event)"

></app-generic-table>
