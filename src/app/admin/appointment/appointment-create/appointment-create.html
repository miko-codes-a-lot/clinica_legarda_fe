<section class="ui-page max-w-4xl">
  <app-page-header title="Create appointment" eyebrow="Appointments" description="Schedule an identified patient with an assigned dentist and available time." />
  @if (caseTitle) { <p class="mb-5 rounded-xl bg-tint p-4 text-sm text-accent">Linked treatment case: {{ caseTitle }}. The patient, clinic and responsible dentist are fixed for this session.</p> }
  @if (loadError) {
    <p class="ui-card mb-5 border-danger-border bg-danger-soft p-4 text-sm text-danger" role="alert">{{ loadError }}</p>
  } @else if (clinics.length !== 0) {
    <app-appointment-form
      [isLoading]="isLoading"
      [dentalServices]="dentalServices"
      [clinics]="clinics"
      [patients]="patients"
      [appointment]="initDoc"
      (onSubmitEvent)="onSubmit($event)">
    </app-appointment-form>
  } @else {
    @if (isLoading) {
      <p class="ui-card p-5 text-sm text-muted" role="status">Loading appointment options...</p>
    } @else {
      <div class="ui-card"><app-empty-state title="No assigned clinics" description="Ask a super admin to assign a clinic before scheduling appointments." icon="domain" /></div>
    }
  }
</section>
