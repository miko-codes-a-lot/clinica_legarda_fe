@if (loadError) {
  <p role="alert">{{ loadError }}</p>
} @else if (clinics.length !== 0) {
  <app-appointment-form
    [isLoading]="isLoading"
    [dentalServices]="dentalServices"
    [clinics]="clinics"
    [patients]="patients"
    [appointment]="initDoc"
    (onSubmitEvent)="onSubmit($event)">
  </app-appointment-form>
} @else {
  @if (isLoading) {
    <p role="status">Loading appointment options...</p>
  } @else {
    <p>No appointment options are available.</p>
  }
}
