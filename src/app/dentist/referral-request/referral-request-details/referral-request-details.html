<section class="ui-page max-w-5xl">
  <app-page-header title="Referral details" eyebrow="Clinical workspace" description="Review the referral and its receiving appointment.">
    @if (referral) { <app-status-badge [status]="referral.status" /> }
  </app-page-header>
  @if (loadError) {
    <p class="ui-card border-danger-border bg-danger-soft p-5 text-sm text-danger" role="alert">{{ loadError }}</p>
  } @else if (referral) {
    <app-list [data]="displayReferral" />
    @if (!referral.appointment) { <p class="mt-5 rounded-xl bg-tint p-4 text-sm text-accent" role="status">This referral is waiting for its receiving appointment to be linked.</p> }
    <section class="ui-card mt-5 flex flex-wrap gap-3 p-5 sm:p-6" aria-label="Referral decision">
      <button type="button" class="ui-button" (click)="approveReferral()" [disabled]="isActionDisabled()"><app-icon name="check" /> Approve</button>
      <button type="button" class="ui-button-danger" (click)="declineReferral()" [disabled]="isActionDisabled()"><app-icon name="close" /> Reject</button>
    </section>
  } @else {
    <p class="ui-card p-5 text-sm text-muted" role="status">Fetching details...</p>
  }
</section>
