@if (loadError) {
  <p role="alert">{{ loadError }}</p>
} @else if (referral) {
  <div class="view-header"><h2 class="page-title">Referral Details</h2></div>
  <app-list [data]="displayReferral"></app-list>
  @if (!referral.appointment) {
    <p>This referral is waiting for its receiving appointment to be linked.</p>
  }
  <div class="action-buttons">
    <button mat-flat-button color="primary" (click)="approveReferral()" [disabled]="isActionDisabled()">
      <mat-icon>check</mat-icon> Approve
    </button>
    <button mat-stroked-button color="warn" (click)="declineReferral()" [disabled]="isActionDisabled()">
      <mat-icon>close</mat-icon> Reject
    </button>
  </div>
} @else {
  <p role="status">Fetching details...</p>
}
