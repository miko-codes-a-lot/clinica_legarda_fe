<app-auth-layout title="Welcome back" eyebrow="Patient portal" description="Sign in to book your next visit and manage your appointments.">
  <form [formGroup]="rxform" (ngSubmit)="onSubmit()" class="space-y-5" [attr.aria-busy]="isLoading">
    <div>
      <label for="patient-username" class="ui-label">
        Username
      </label>
      <input id="patient-username" type="text" class="ui-input" placeholder="Enter your username" formControlName="username" autocomplete="username" [attr.aria-invalid]="username.touched && username.invalid">
      @if (username.touched && username.hasError('required')) {
      <p class="mt-2 text-xs text-danger" role="alert">
        Enter your username.
      </p>
      }
    </div>
    <div>
      <div class="mb-2 flex flex-wrap items-center justify-between gap-2">
        <label for="patient-password" class="ui-label mb-0">
          Password
        </label>
        <a routerLink="/app/forgot-password" class="text-xs font-semibold text-accent underline underline-offset-4">
          Forgot password?
        </a>
      </div>
      <input id="patient-password" type="password" class="ui-input" placeholder="Enter your password" formControlName="password" autocomplete="current-password" [attr.aria-invalid]="password.touched && password.invalid">
      @if (password.touched && password.hasError('required')) {
      <p class="mt-2 text-xs text-danger" role="alert">
        Enter your password.
      </p>
      }
    </div>
    <button type="submit" class="ui-button w-full" [disabled]="!rxform.valid || isLoading">
      {{ isLoading ? 'Signing in…' : 'Sign in' }}
      <span class="material-icons !text-lg" aria-hidden="true">
        arrow_forward
      </span>
    </button>
  </form>
  <div class="mt-7 border-t border-stroke pt-6 text-center">
    <p class="text-sm text-muted">
      New to Clinica Legarda?
    </p>
    <button type="button" class="ui-button-secondary mt-3 w-full" (click)="goToRegister()">
      Create a patient account
    </button>
  </div>
</app-auth-layout>
