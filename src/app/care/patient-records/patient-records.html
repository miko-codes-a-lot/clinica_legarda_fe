<div class="ui-page">
  <app-page-header title="Patient records" eyebrow="Care workspace" description="Find an identified patient and open their clinic care history." />
  <form class="mb-4 ui-table-filter-group rounded-2xl border border-stroke bg-surface p-3" [formGroup]="form" (ngSubmit)="search()">
    <label class="ui-table-field min-w-56 !flex-1"><span>Patient search</span><span class="relative block"><app-icon name="magnifying-glass" class="pointer-events-none absolute left-2.5 top-1/2 -translate-y-1/2 !size-4 text-muted" /><input class="ui-input ui-table-control !pl-8" formControlName="search" maxlength="100" placeholder="Name, username, phone or email" type="search" /></span></label>
    <label class="ui-table-field ui-table-field--clinic"><span>Clinic</span><select class="ui-input ui-table-control" formControlName="clinic"><option value="">All accessible clinics</option>@for (clinic of clinics; track clinic._id) { <option [value]="clinic._id">{{ clinic.name }}</option> }</select></label>
    <label class="ui-table-field ui-table-field--wide"><span>Account</span><select class="ui-input ui-table-control" formControlName="status"><option value="">All accounts</option><option value="confirmed">Confirmed</option><option value="pending">Pending verification</option><option value="walk_in">Walk-in</option><option value="rejected">Rejected</option></select></label>
    <label class="ui-table-field ui-table-field--wide"><span>Registration</span><select class="ui-input ui-table-control" formControlName="registration"><option value="">All registrations</option><option value="walk_in">Walk-in</option><option value="standard">Standard</option></select></label>
    <button class="ui-button !min-h-9 !rounded-lg !px-3 !py-2 !text-xs" type="submit" [disabled]="loading">Search</button><button class="ui-button-ghost !min-h-9 !px-2 !py-2 !text-xs" type="button" (click)="resetFilters()" [disabled]="loading">Reset</button>
  </form>
  @if (clinicError) { <p role="alert" class="ui-alert-error mb-4">{{ clinicError }}</p> }
  @if (error) { <p role="alert" class="ui-alert-error mb-4">{{ error }}</p> }
  @if (loading) { <p role="status" class="ui-muted py-8">Loading patient records…</p> }
  @else if (!error && !result.items.length) { <app-empty-state title="No patients found" description="Try a different search or clinic. Only patients within your access are shown." icon="person_search" /> }
  @else if (!error) {
    <app-generic-table title="Patient records" [embedded]="true" [serverMode]="true" [searchEnabled]="false" [rows]="result.items" [columnDefs]="columns" [displayedColumns]="['name','emailAddress','mobileNumber','status','actions']" [totalRows]="result.total" [sortBy]="sortBy" [sortDirection]="direction" (sortChanged)="sortPatients($event)">
      <ng-template tableCell="actions" let-patient><a class="ui-button-ghost whitespace-nowrap text-xs" [routerLink]="[base, 'patients', patient._id]" [queryParams]="form.controls.clinic.value ? { clinic: form.controls.clinic.value } : {}">Open record</a></ng-template>
    </app-generic-table>
    <nav aria-label="Patient record pages" class="mt-4 flex flex-wrap items-center justify-between gap-3"><p class="ui-muted">{{ result.total }} patients · Page {{ result.page }} of {{ lastPage }}</p><div class="flex gap-2"><button class="ui-button-secondary" type="button" [disabled]="result.page <= 1" (click)="search(result.page - 1)">Previous</button><button class="ui-button-secondary" type="button" [disabled]="result.page >= lastPage" (click)="search(result.page + 1)">Next</button></div></nav>
  }
</div>
