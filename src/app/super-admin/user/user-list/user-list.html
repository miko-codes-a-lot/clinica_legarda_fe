<app-generic-table
  [title]="title"
  [createButtonLabel]="createLabel"
  [displayedColumns]="displayedColumns"
  [columnDefs]="columnDefs"
  [filters]="filters" sortBy="name" searchPlaceholder="Search name, username or contact"
  [dataSource]="dataSource"
  [enableDelete]="isSuperAdmin"
  [isLoading]="isLoading"
  (details)="onDetails($event)"
  (update)="onUpdate($event)"
  (delete)="onDelete($event)"
  (create)="onCreate()"
></app-generic-table>
